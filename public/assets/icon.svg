<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Metallic Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bezel)" stroke="#94a3b8" stroke-width="4" />
  <rect x="28" y="28" width="456" height="456" rx="84" fill="url(#bg)" stroke="#1e293b" stroke-width="3" />

  <!-- Radar Grid & Targeting Circles (Classic EV Reticle) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#0ea5e9" stroke-opacity="0.35" stroke-width="2" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#0ea5e9" stroke-opacity="0.45" stroke-width="2" />
  <line x1="256" y1="56" x2="256" y2="456" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Navigation Radar Ring -->
  <circle cx="256" cy="256" r="40" fill="url(#pulse)" />

  <!-- Stylized Escape Velocity Spacecraft (Delta Wing) -->
  <polygon points="256,120 340,340 256,300 172,340" fill="url(#shipGrad)" stroke="#e0f2fe" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Cockpit & Thruster Glow -->
  <polygon points="256,170 274,250 256,242 238,250" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
  <polygon points="246,304 266,304 256,360" fill="#f59e0b" opacity="0.9" />

  <!-- Tactical Reticle Brackets -->
  <path d="M 160 160 L 140 160 L 140 180" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <path d="M 352 160 L 372 160 L 372 180" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <path d="M 140 332 L 140 352 L 160 352" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <path d="M 372 332 L 372 352 L 352 352" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
</svg>
